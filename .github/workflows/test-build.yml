name: Build Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: build-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 0.161.1 embeds KaTeX 0.16.x; 0.166.0 embeds KaTeX 0.18.x. Testing
        # both covers each branch of the KaTeX CSS version selection in
        # layouts/_partials/scripts/katex.html.
        hugo-version: ["0.161.1", "0.166.0"]
    env:
      HUGO_VERSION: ${{ matrix.hugo-version }}
      # These specs build temporary Hugo sites and inspect the output files
      # directly, so no browser or web server is needed. Setting BASE_URL
      # keeps Playwright from starting the docs webServer.
      BASE_URL: http://localhost:1313
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Install dependencies
        run: npm ci

      - name: Run build tests
        run: npm run test:build

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-tests-report-hugo-${{ matrix.hugo-version }}
          path: playwright-report/
          retention-days: 14
