{{- $page := .page -}}
{{- with $page.Fragments.Headings -}}
  <ul class="hextra-sidebar-guide-list">
    {{- range . -}}
      {{- with .Headings -}}
        {{- range . -}}
          <li>
            <a
              href="#{{ anchorize .ID }}"
              class="hextra-sidebar-toc-link"
            >
              {{- .Title | safeHTML | plainify | htmlUnescape -}}
            </a>
          </li>
        {{- end -}}
      {{- end -}}
    {{- end -}}
  </ul>
{{- end -}}
