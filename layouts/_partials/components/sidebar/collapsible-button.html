{{- /* Expand/collapse toggle shared by link and group-title sidebar items. */ -}}
{{- if .hasChildren -}}
  <button type="button" class="hextra-sidebar-collapsible-button" aria-label="{{ (T "toggleSection") | default "Toggle section" }}" aria-expanded="{{ if .open }}true{{ else }}false{{ end }}">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true" focusable="false" class="hextra-sidebar-collapsible-icon">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" class="hextra-sidebar-collapsible-icon-path"></path>
    </svg>
  </button>
{{- end -}}
